<defs>
  <style>
    @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes blink-slow { 0%,79%{opacity:1} 80%,100%{opacity:0.2} }
    @keyframes data-scroll { 0%{opacity:0;transform:translateY(4px)} 15%{opacity:1;transform:translateY(0)} 85%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-4px)} }
    .sweep-arm { transform-origin: 210px 210px; animation: sweep 4s linear infinite; }
    .trail-1 { transform-origin: 210px 210px; animation: sweep 4s linear infinite; }
    .trail-2 { transform-origin: 210px 210px; animation: sweep 4s linear -0.15s infinite; }
    .trail-3 { transform-origin: 210px 210px; animation: sweep 4s linear -0.3s infinite; }
    .trail-4 { transform-origin: 210px 210px; animation: sweep 4s linear -0.45s infinite; }
    .blink-fast { animation: blink 1.1s step-end infinite; }
    .blink-med  { animation: blink-slow 2.4s ease-in-out infinite; }
    .cursor     { animation: blink 0.9s step-end infinite; }
    .data-line  { animation: data-scroll 5s ease-in-out infinite; }
    .data-line-2{ animation: data-scroll 5s ease-in-out -2.5s infinite; }
  </style>
